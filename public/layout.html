<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{CSRF_TOKEN}}">
    <title>Belajaryuk - Platform Pembelajaran Interaktif</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ASSET_PATH}}/assets/favicon.svg">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{ASSET_PATH}}/assets/css/gaya.css">
    <link rel="stylesheet" href="{{ASSET_PATH}}/assets/css/responsif.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- External Libraries & Initialization -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="{{ASSET_PATH}}/js/init.js" defer></script>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-logo">
            <div class="css-art-logo"></div>
            <h1>Belajaryuk</h1>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay d-none"></div>

    <!-- Notifications -->
    <div id="notification-toast" class="notification-toast"></div>

    <!-- Custom Dialog Modal -->
    <div id="custom-modal" class="modal-overlay d-none">
        <div class="modal-card">
            <div id="modal-icon" class="modal-icon"></div>
            <h3 id="modal-title" class="modal-title">Konfirmasi</h3>
            <p id="modal-message" class="modal-message">Apakah Anda yakin?</p>
            <div class="modal-actions">
                <button type="button" id="modal-cancel-btn" class="btn-ghost">Batal</button>
                <button type="button" id="modal-confirm-btn" class="btn-primary">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <!-- Global Navigation (Private/Student) -->
    <nav id="global-nav" class="global-nav d-none">
        <div class="nav-top-bar">
            <div class="nav-brand-logo">
                <div class="nav-logo-wrapper">
                    <div class="css-art-logo"></div>
                </div>
                <span>Belajaryuk</span>
            </div>
            <div class="nav-actions">
                <div class="nav-menu-main">
                    <button type="button" data-page="dashboard-page"><i data-lucide="home"></i> Beranda</button>
                    <button type="button" data-page="materials-page"><i data-lucide="book-open"></i> Materi</button>
                    <button type="button" data-page="progress-page"><i data-lucide="line-chart"></i> Progress</button>
                    <button type="button" data-page="profile-page"><i data-lucide="user"></i> Profil</button>
                </div>
                <div class="nav-divider"></div>
                <button type="button" class="btn-ghost btn-icon-only" data-action="toggle-theme" title="Ganti Tema">
                    <i data-lucide="moon"></i>
                </button>
                <button type="button" class="btn-outline btn-small" data-action="logout">Keluar</button>
            </div>
        </div>
        <div class="nav-bottom-bar mobile-only">
            <!-- Buttons will be moved here via CSS or logic for mobile if needed, 
                 but for desktop they now live in nav-top-bar -->
        </div>
    </nav>

    <!-- Main App Container -->
    <div id="app" class="app-container">
        <section id="landing-page" class="page d-none"></section>
        <section id="login-page" class="page d-none"></section>
        <section id="register-page" class="page d-none"></section>
        <section id="dashboard-page" class="page d-none"></section>
        <section id="materials-page" class="page d-none"></section>
        <section id="material-detail-page" class="page d-none"></section>
        <section id="progress-page" class="page d-none"></section>
        <section id="profile-page" class="page d-none"></section>
        <section id="quiz-page" class="page d-none"></section>
        <section id="admin-page" class="page d-none"></section>
    </div>

    <!-- AI Chat Widget Container -->
    <div id="ai-chat-widget" class="ai-chat-widget d-none"></div>

    <!-- External Libraries (JavaScript) -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    
    <!-- Application Scripts (Entry Point) -->
    <script src="{{ASSET_PATH}}/js/app.js" type="module"></script>
</body>
</html>
