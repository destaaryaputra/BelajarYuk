<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Book Cover (Primary Green) -->
  <rect x="4" y="10" width="56" height="40" rx="6" fill="#1f8a70" />
  
  <!-- Book Thickness / Page Edges (Darker Green) -->
  <path d="M4 44 L60 44 L60 48 C60 51 58 52 55 52 L9 52 C6 52 4 51 4 48 Z" fill="#176f5a" />
  
  <!-- Pages Group -->
  <g transform="translate(7, 13)">
    <!-- Left Page -->
    <rect x="0" y="0" width="23" height="32" rx="2" fill="white" />
    <!-- Content Lines on Left Page -->
    <line x1="4" y1="8" x2="19" y2="8" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="4" y1="16" x2="15" y2="16" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="4" y1="24" x2="19" y2="24" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Right Page -->
    <rect x="27" y="0" width="23" height="32" rx="2" fill="white" />
    <!-- Content Lines on Right Page -->
    <line x1="31" y1="8" x2="46" y2="8" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="31" y1="16" x2="42" y2="16" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="31" y1="24" x2="46" y2="24" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
  </g>
  
  <!-- Subtle Spine Shadow -->
  <rect x="31" y="10" width="2" height="40" fill="white" opacity="0.2" />
</svg>
