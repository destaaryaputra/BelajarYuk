<div id="ai-chat-window" class="ai-chat-window">
    <div class="ai-chat-header">
        <div class="ai-header-main">
            <div class="ai-avatar">
                <i data-lucide="bot"></i>
                <span class="status-dot"></span>
            </div>
            <div class="ai-header-info">
                <span class="ai-name">Yuki</span>
                <span class="ai-status">Siap Menemani Belajarmu</span>
            </div>
        </div>
        <div class="ai-header-actions">
            <button class="ai-close-btn" id="ai-chat-fs-btn" title="Layar Penuh">
                <i data-lucide="maximize-2" id="ai-fs-icon" class="icon-sm"></i>
            </button>
            <button class="ai-close-btn" id="ai-chat-clear-btn" title="Hapus Riwayat Obrolan">
                <i data-lucide="rotate-ccw" class="icon-sm"></i>
            </button>
            <button class="ai-close-btn" id="ai-chat-close-btn" title="Tutup Chat">
                <i data-lucide="x" class="icon-md"></i>
            </button>
        </div>
    </div>
    <div id="ai-chat-messages" class="ai-chat-messages">
        <div class="chat-message ai-message">
            Halo! Saya Yuki, Asisten AI Belajaryuk. Ada yang membuatmu bingung saat belajar? Tanyakan saja padaku!
        </div>
    </div>
    <div class="ai-chat-input-area">
        <input type="text" id="ai-chat-input" placeholder="Ketik pertanyaanmu...">
        <button id="ai-chat-send-btn" title="Kirim Pesan">
            <i data-lucide="send-horizontal"></i>
        </button>
    </div>
</div>
<button id="ai-chat-toggle" class="ai-chat-toggle" title="Tanya AI">
    <i data-lucide="sparkles"></i>
</button>
