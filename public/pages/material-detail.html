<main class="learning-detail-page-shell">
    <div class="material-detail-toolbar">
        <button type="button" class="btn-back-material" data-page="materials-page">
            <i data-lucide="arrow-left"></i>
            Kembali ke Materi
        </button>
        <div class="toolbar-info">
            <span class="text-muted">Materi Aktif:</span>
            <strong id="current-episode-title">Memuat...</strong>
        </div>
    </div>

    <!-- Mobile Navigation Tabs -->
    <div class="mobile-detail-tabs mobile-only" id="material-tabs">
        <button type="button" class="tab-btn active" data-tab="content">
            <i data-lucide="book-open"></i> Materi
        </button>
        <button type="button" class="tab-btn" data-tab="syllabus">
            <i data-lucide="list-video"></i> Episode
        </button>
        <button type="button" class="tab-btn" data-tab="comments">
            <i data-lucide="message-square"></i> Diskusi
        </button>
    </div>

    <div class="learning-detail-layout">
        <div id="material-detail"></div>
        <aside id="course-syllabus" class="content-card"></aside>
    </div>
</main>
